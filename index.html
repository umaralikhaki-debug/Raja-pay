<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raja Pay - Repayment Link</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f3f3;padding:16px}
.card{max-width:480px;margin:auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.header{background:#ff7a00;color:#fff;padding:20px;text-align:center}
.header h1{margin:0;font-size:22px}
.header p{margin:5px 0 0;opacity:.9;font-size:13px}
.body{padding:18px}
label{font-size:13px;font-weight:bold;display:block;margin:14px 0 5px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#ff7a00}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#ff7a00;color:#fff;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}
.btn2{background:#25D366}
.box{background:#fff7ed;border:1px solid #ffcc99;border-radius:12px;padding:14px;margin-top:14px;word-break:break-all;font-size:13px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #eee;font-size:15px}
.row b{color:#111}
.big{font-size:28px;font-weight:900;text-align:center;margin:10px 0}
.small{color:#666;font-size:13px;text-align:center}
.paybtn{display:block;text-align:center;text-decoration:none;background:#ff7a00;color:#fff;padding:14px;border-radius:12px;font-weight:bold;margin-top:12px}
.paybtn.green{background:#16a34a}
.note{background:#fef3c7;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
function getData(){
  try{
    const p=new URLSearchParams(location.search);
    const c=p.get('c');
    if(!c) return null;
    return JSON.parse(atob(c));
  }catch(e){return null}
}
const d=getData();
const app=document.getElementById('app');
if(!d){
  app.innerHTML=`
  <div class="header"><h1>Repayment Link Banao</h1><p>Raja Pay Generator</p></div>
  <div class="body">
    <label>Business Name</label><input id="biz" placeholder="e.g. Raja Loan" value="Raja Loan">
    <label>Customer Name</label><input id="name" placeholder="e.g. Ahmed Khan">
    <label>Customer Mobile (WhatsApp)</label><input id="mobile" placeholder="923001234567" type="tel">
    <label>Days Left</label><input id="days" type="number" placeholder="e.g. 2" value="2">
    <label>Extension Amount (Rs)</label><input id="ext" type="number" placeholder="e.g. 500" value="500">
    <label>Full Repayment Amount (Rs)</label><input id="full" type="number" placeholder="e.g. 10000" value="10000">
    <label>Channel 1 - UPI ID *</label><input id="upi1" placeholder="e.g. raja@okhdfc">
    <label>Channel 2 - UPI ID</label><input id="upi2" placeholder="Optional">
    <label>Channel 3 - UPI ID</label><input id="upi3" placeholder="Optional">
    <label>Channel 4 - UPI ID</label><input id="upi4" placeholder="Optional">
    <label>Channel 5 - UPI ID</label><input id="upi5" placeholder="Optional">
    <button class="btn" onclick="makeLink()">Customer Link Banao</button>
    <div id="out"></div>
  </div>`;
}else{
  const upis=[d.upi1,d.upi2,d.upi3,d.upi4,d.upi5].filter(x=>x);
  let btns=upis.map((u,i)=>{
    return `<a class="paybtn" href="upi://pay?pa=${encodeURIComponent(u)}&pn=${encodeURIComponent(d.biz)}&am=${d.full}&cu=PKR&tn=Full Repayment ${d.name}">Repay via Channel ${i+1} - ${u}</a>
    <a class="paybtn green" href="upi://pay?pa=${encodeURIComponent(u)}&pn=${encodeURIComponent(d.biz)}&am=${d.ext}&cu=PKR&tn=Extension ${d.name}">Extension via Channel ${i+1} - Rs ${d.ext}</a>`;
  }).join('');
  app.innerHTML=`
  <div class="header"><h1>${d.biz}</h1><p>Pending Repayment</p></div>
  <div class="body">
    <div class="small">Hello, ${d.name}</div>
    <div class="big">Rs ${d.full}</div>
    <div class="small">Full Repayment Amount</div>
    <div class="row"><span>Days Left</span><b>${d.days} Days</b></div>
    <div class="row"><span>Extension Fee</span><b>Rs ${d.ext}</b></div>
    <div class="row"><span>Status</span><b style="color:#ea580c">Pending</b></div>
    <div class="note">Agar aap full amount nahi de sakte to Extension lein. Extension se aapka loan aage barh jayega.</div>
    ${btns}
    <p class="small">Payment ke baad screenshot WhatsApp par bhejein.</p>
  </div>`;
}
function makeLink(){
  const data={
    biz:document.getElementById('biz').value||'Raja Loan',
    name:document.getElementById('name').value||'Customer',
    mobile:document.getElementById('mobile').value||'',
    days:document.getElementById('days').value||'0',
    ext:document.getElementById('ext').value||'0',
    full:document.getElementById('full').value||'0',
    upi1:document.getElementById('upi1').value,
    upi2:document.getElementById('upi2').value,
    upi3:document.getElementById('upi3').value,
    upi4:document.getElementById('upi4').value,
    upi5:document.getElementById('upi5').value,
  };
  if(!data.upi1){alert('Channel 1 UPI zaroori hai');return;}
  const code=btoa(JSON.stringify(data));
  const link=location.origin+location.pathname+'?c='+code;
  const msg=`Hello ${data.name}, aapki ${data.biz} ki repayment pending hai. Days Left: ${data.days}, Extension: Rs ${data.ext}, Full Amount: Rs ${data.full}. Link: ${link}`;
  document.getElementById('out').innerHTML=`
  <div class="box"><b>Customer Link:</b><br>${link}</div>
  <button class="btn" onclick="navigator.clipboard.writeText('${link}');alert('Copy ho gaya')">Link Copy Karo</button>
  <a class="btn btn2" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/${data.mobile}?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp Par Bhejo</a>`;
}
</script>
</body>
</html>
